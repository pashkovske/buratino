version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: buratino_postgres
    environment:
      POSTGRES_DB: buratino_db
      POSTGRES_USER: buratino_user
      POSTGRES_PASSWORD: buratino_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    networks:
      - buratino_network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  buratino_network:
    driver: bridge
