spring.application.name=buratino

# Tinkoff API configuration
tinkoff.token=${TINKOFF_API_TOKEN}
account.name=${ACCOUNT_NAME}
invest.connector.token=${TINKOFF_API_TOKEN}

auth.predefined.api-key=${ANONYMOUS_PASSWORD}

# R2DBC configuration
spring.r2dbc.url=r2dbc:postgresql://localhost:5432/buratino_db
spring.r2dbc.username=buratino_user
spring.r2dbc.password=buratino_password

# Flyway configuration (uses JDBC for migrations)
spring.flyway.url=jdbc:postgresql://localhost:5432/buratino_db
spring.flyway.user=buratino_user
spring.flyway.password=buratino_password
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration
