# Test profile - без интеграции с API Тинькофф
spring.profiles.active=test

# Database configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/buratino_db
spring.datasource.username=buratino_user
spring.datasource.password=buratino_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Disable Tinkoff API integration for testing
tinkoff.api.enabled=false
